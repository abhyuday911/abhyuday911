<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Full-duplex link: requests flow client -> server on the top lane,
       live ticks flow server -> client on the bottom lane. -->
  <style>
    .up { animation: up 1.6s linear infinite; }
    .down { animation: down 1.6s linear infinite; }
    .late { animation-delay: -0.8s; }
    .live { animation: live 1.6s ease-in-out infinite; }
    @keyframes up {
      0% { transform: translateX(0); opacity: 0; }
      15%, 85% { opacity: 1; }
      100% { transform: translateX(13px); opacity: 0; }
    }
    @keyframes down {
      0% { transform: translateX(0); opacity: 0; }
      15%, 85% { opacity: 1; }
      100% { transform: translateX(-13px); opacity: 0; }
    }
    @keyframes live { 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) {
      .up, .down, .live { animation: none; }
      .up { transform: translateX(6.5px); }
      .down { transform: translateX(-6.5px); }
      .late { opacity: 0; }
    }
  </style>
  <rect x="1.5" y="4" width="3" height="16" rx="1.5" fill="#71717a" />
  <rect class="live" x="19.5" y="4" width="3" height="16" rx="1.5" fill="#22c55e" />
  <path d="M5.5 8.5h13M5.5 15.5h13" stroke="#3f3f46" stroke-width="1.5" stroke-linecap="round" />
  <circle class="up" cx="5.5" cy="8.5" r="1.6" fill="#71717a" />
  <circle class="up late" cx="5.5" cy="8.5" r="1.6" fill="#71717a" />
  <circle class="down" cx="18.5" cy="15.5" r="1.6" fill="#22c55e" />
  <circle class="down late" cx="18.5" cy="15.5" r="1.6" fill="#22c55e" />
</svg>
